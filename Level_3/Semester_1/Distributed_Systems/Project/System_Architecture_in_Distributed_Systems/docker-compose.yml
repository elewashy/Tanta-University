version: '3.8'

services:
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=order-service
    networks:
      - distributed-system

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVICE_NAME=payment-service
    depends_on:
      - order-service
    networks:
      - distributed-system

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVICE_NAME=notification-service
    depends_on:
      - order-service
    networks:
      - distributed-system

networks:
  distributed-system:
    driver: bridge
